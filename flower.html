<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bó hoa tặng nàng</title>
    <link rel="icon" href="./assets/a/icon1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink-50: #fff6f8;
            --pink-100: #ffe6ec;
            --pink-300: #f8a9bb;
            --pink-500: #f0436f;
            --ink: #5c2f3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Mali', cursive;
            color: var(--ink);
            background: #fff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .layer { position: fixed; inset: 0; pointer-events: none; }

        /* ================= Màn 1: chú thỏ ================= */
        #intro {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 5;
            transition: opacity .6s;
        }

        #intro.leave { opacity: 0; pointer-events: none; }

        .bunny-card {
            width: min(70vw, 380px);
            aspect-ratio: 1;
            background: #fff url(./assets/a/anhz.png) center / 92% no-repeat;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 22px 6px rgba(255, 140, 160, .45);
            animation: cardIn .9s cubic-bezier(.2, .9, .3, 1.3) both, breathe 2.4s 1s ease-in-out infinite;
        }

        #intro.leave .bunny-card { animation: cardOut .6s ease-in forwards; }

        .intro-hint {
            font-style: italic;
            font-weight: 500;
            color: var(--pink-500);
            font-size: 20px;
            animation: blink 1.6s ease-in-out infinite;
        }

        @keyframes cardIn { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
        @keyframes cardOut { to { transform: scale(1.4) rotate(6deg); opacity: 0; } }
        @keyframes breathe { 50% { transform: scale(1.04); box-shadow: 0 0 34px 12px rgba(255, 140, 160, .55); } }
        @keyframes blink { 50% { opacity: .45; } }

        /* ================= Màn 2: bó hoa ================= */
        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            visibility: hidden;
        }

        #stage.show { visibility: visible; }

        .name {
            position: relative;
            z-index: 2;
            font-size: clamp(30px, 8vw, 46px);
            font-weight: 700;
            color: var(--pink-500);
            text-shadow: 0 0 18px rgba(255, 120, 150, .55);
            opacity: 0;
        }

        #stage.show .name { animation: nameIn 1s .2s forwards, glow 3s 1.2s ease-in-out infinite; }

        @keyframes nameIn { from { opacity: 0; transform: translateY(-20px) scale(.8); } to { opacity: 1; transform: none; } }
        @keyframes glow { 50% { text-shadow: 0 0 28px rgba(255, 120, 150, .9); } }

        .bouquet {
            position: relative;
            z-index: 1;
            width: min(84vw, 62vh, 460px);
            aspect-ratio: 729 / 864;
            margin-top: -4px;
        }

        /* Những khoảnh khắc nhỏ của bé nhím, nằm phía sau bó hoa để không che phần chính. */
        .hedgehog-moments {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .hedgehog-moment {
            --size: clamp(76px, 13vw, 148px);
            position: absolute;
            width: var(--size);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            opacity: 0;
            scale: .5;
        }

        .hedgehog-moment::before {
            content: "";
            position: absolute;
            inset: 12%;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, var(--halo), transparent 70%);
            opacity: .5;
            filter: blur(3px);
        }

        .hedgehog-moment img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 7px 7px rgba(92, 47, 59, .20));
            transform: rotate(var(--tilt));
        }

        #stage.show .hedgehog-moment { animation: stickerIn .65s calc(.65s + var(--delay)) cubic-bezier(.2, .9, .3, 1.3) forwards; }
        #stage.show .hedgehog-moment img { animation: stickerFloat var(--float) calc(1.4s + var(--delay)) ease-in-out infinite alternate; }

        @keyframes stickerIn { to { opacity: 1; scale: 1; } }
        @keyframes stickerFloat {
            from { transform: rotate(var(--tilt)) translateY(0); }
            to { transform: rotate(var(--tilt)) translateY(-10px); }
        }

        .hedgehog-moment--sleep { top: 13%; left: max(2vw, calc(50% - 580px)); }
        .hedgehog-moment--eat { top: 20%; right: max(2vw, calc(50% - 585px)); }
        .hedgehog-moment--piano { bottom: 7%; left: max(3vw, calc(50% - 600px)); }
        .hedgehog-moment--work { bottom: 7%; right: max(2vw, calc(50% - 600px)); }
        .hedgehog-moment--happy { top: 50%; left: max(1vw, calc(50% - 525px)); }
        .hedgehog-moment--camera { top: 50%; right: max(1vw, calc(50% - 525px)); }

        @media (max-width: 620px) {
            .hedgehog-moment { --size: clamp(54px, 17vw, 86px); }
            .hedgehog-moment--sleep { top: 13%; left: -1.5%; }
            .hedgehog-moment--eat { top: 24%; right: -2%; }
            .hedgehog-moment--piano { bottom: 8%; left: -2%; }
            .hedgehog-moment--work { bottom: 17%; right: -2%; }
            .hedgehog-moment--happy { top: 50%; left: -3%; }
            .hedgehog-moment--camera { top: 50%; right: -3%; }
        }

        /* Quầng sáng hồng sau bó hoa */
        .bouquet::before {
            content: "";
            position: absolute;
            inset: -12% -18%;
            background: radial-gradient(closest-side, rgba(255, 170, 190, .45), transparent);
            opacity: 0;
        }

        #stage.show .bouquet::before { animation: fadeIn 2s .4s forwards; }

        .wrap-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform-origin: 50% 80%;
        }

        #stage.show .wrap-img { animation: wrapIn 1s .3s cubic-bezier(.2, .9, .3, 1.2) forwards; }

        @keyframes wrapIn { from { opacity: 0; transform: scale(.6) translateY(40px); } to { opacity: 1; transform: none; } }
        @keyframes fadeIn { to { opacity: 1; } }

        .envelope {
            position: absolute;
            left: 50%;
            top: 75%;
            width: 26%;
            translate: -50% -50%;
            border: none;
            padding: 7px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .62);
            box-shadow: 0 7px 16px rgba(151, 42, 78, .28), inset 0 0 0 1px rgba(255, 255, 255, .85);
            cursor: pointer;
            opacity: 0;
            z-index: 2;
            isolation: isolate;
            transition: filter .2s ease, box-shadow .2s ease;
        }

        .envelope::before {
            content: "";
            position: absolute;
            inset: -5px;
            z-index: -1;
            border: 2px solid rgba(255, 255, 255, .9);
            border-radius: 22px;
            background: rgba(255, 187, 205, .32);
            box-shadow: 0 0 0 3px rgba(239, 107, 145, .22);
        }

        .envelope img { width: 100%; display: block; filter: drop-shadow(0 4px 7px rgba(194, 58, 92, .42)); }

        .envelope:hover, .envelope:focus-visible {
            filter: brightness(1.04) saturate(1.1);
            box-shadow: 0 9px 20px rgba(151, 42, 78, .38), inset 0 0 0 1px #fff;
            outline: none;
        }

        .envelope:focus-visible::before { box-shadow: 0 0 0 5px rgba(239, 107, 145, .48); }

        #stage.show .envelope { animation: fadeIn .6s 3.4s forwards, wiggle 2s 4s ease-in-out infinite; }

        @keyframes wiggle {
            0%, 70%, 100% { transform: none; }
            75% { transform: rotate(-10deg) scale(1.1); }
            85% { transform: rotate(10deg) scale(1.1); }
        }

        .envelope-hint {
            position: absolute;
            left: 50%;
            top: 89%;
            translate: -50% 0;
            white-space: nowrap;
            padding: 5px 12px 6px;
            border: 1px solid rgba(224, 82, 123, .28);
            border-radius: 999px;
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 3px 10px rgba(198, 57, 96, .18);
            font-size: clamp(13px, 3.5vw, 16px);
            font-weight: 700;
            letter-spacing: .1px;
            color: #bd315a;
            opacity: 0;
            z-index: 3;
        }

        #stage.show .envelope-hint { animation: fadeIn .6s 3.8s forwards, hintFloat 2s 4.4s ease-in-out infinite; }

        @keyframes hintFloat { 50% { transform: translateY(-4px); } }

        /* ================= Lá thư ================= */
        #letterWrap {
            position: fixed;
            inset: 0;
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(40, 40, 40, .55);
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s;
        }

        #letterWrap.open { opacity: 1; pointer-events: auto; }

        .letter {
            position: relative;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            background: #fff8fb;
            border-radius: 20px;
            padding: 18px 20px 22px;
            text-align: center;
            box-shadow: 0 0 26px 6px rgba(255, 140, 170, .55);
            transform: scale(.3) rotate(-6deg);
            transition: transform .5s cubic-bezier(.2, .9, .3, 1.4);
        }

        #letterWrap.open .letter { transform: none; }

        .letter-photo-frame {
            margin: 0 auto 18px;
            width: min(100%, 340px);
        }

        .letter-photo {
            display: block;
            width: 100%;
            max-height: min(43vh, 360px);
            object-fit: contain;
            border-radius: 0;
            background: transparent;
        }

        .letter h2 { color: var(--pink-500); font-size: 26px; line-height: 1.25; margin-bottom: 12px; }

        .letter .message { font-size: 17px; line-height: 1.75; white-space: pre-line; min-height: 2em; padding: 0 4px; }

        .letter .message::after { content: "|"; color: var(--pink-500); animation: blink 1s steps(1) infinite; }
        .letter .message.done::after { content: ""; }

        .letter .sign { text-align: right; margin-top: 18px; font-style: italic; font-weight: 500; color: #f06c8e; font-size: 18px; opacity: 0; transition: opacity .8s; }
        .letter .sign.show { opacity: 1; }

        /* ================= Hiệu ứng nền ================= */
        .petal {
            position: absolute;
            top: -30px;
            border-radius: 80% 0 80% 0;
            background: linear-gradient(135deg, #ffc2cf, #f78aa5);
            opacity: .85;
            animation: fall linear forwards;
        }

        @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }

        .heart {
            position: absolute;
            font-size: var(--s);
            line-height: 1;
            animation: burst 1.1s ease-out forwards;
        }

        @keyframes burst {
            from { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
            to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff9db4;
            box-shadow: 0 0 8px 2px #ffc4d2;
            animation: twinkle 2.4s ease-in-out forwards;
        }

        @keyframes twinkle { 0%, 100% { transform: scale(0); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }

        /* Thỏ con chạy qua lại */
        .runner {
            position: absolute;
            bottom: 10px;
            left: 0;
            animation: run var(--t) linear forwards;
        }

        .runner .hop {
            width: var(--size);
            animation: hop .55s ease-in-out infinite alternate;
        }

        .runner .hop svg { width: 100%; display: block; overflow: visible; }

        .runner.rtl .hop { scale: -1 1; }

        @keyframes run { from { transform: translateX(var(--from)); } to { transform: translateX(var(--to)); } }
        @keyframes hop { from { translate: 0 0; rotate: -6deg; } to { translate: 0 -22px; rotate: 6deg; } }

        /* Bướm bay */
        .butterfly {
            position: absolute;
            left: 0;
            top: 0;
            animation: fly var(--t) linear forwards;
        }

        .butterfly .bob { animation: bob 1.4s ease-in-out infinite alternate; }

        .butterfly svg { width: 34px; display: block; }

        .butterfly .wing { transform-box: fill-box; animation: flap .22s ease-in-out infinite alternate; }
        .butterfly .wing.l { transform-origin: 100% 50%; }
        .butterfly .wing.r { transform-origin: 0% 50%; }

        @keyframes fly { from { transform: translate(var(--x0), var(--y0)); } to { transform: translate(var(--x1), var(--y1)); } }
        @keyframes bob { from { translate: 0 -18px; } to { translate: 0 18px; } }
        @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }

        /* Ảnh kỷ niệm bay lượn */
        #memories { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

        .memory {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--w);
            aspect-ratio: 1;
            padding: 3px;
            border: none;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 0 14px 3px rgba(255, 130, 160, .55);
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 1s;
        }

        .memory.show { opacity: 1; }

        .memory img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; display: block; pointer-events: none; }

        #photoView {
            position: fixed;
            inset: 0;
            z-index: 9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(40, 40, 40, .6);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }

        #photoView.open { opacity: 1; pointer-events: auto; }

        #photoView img {
            max-width: min(80vw, 360px);
            max-height: 70vh;
            border: 6px solid #fff;
            border-radius: 18px;
            box-shadow: 0 0 30px 8px rgba(255, 130, 160, .6);
            transform: scale(.5);
            transition: transform .4s cubic-bezier(.2, .9, .3, 1.4);
        }

        #photoView.open img { transform: none; }

        #musicBtn {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 9;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--pink-300);
            background: #fff;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        #musicBtn.spin { animation: spin 3s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>

<body>
    <div class="layer" id="bg"></div>

    <!-- Màn 1 -->
    <section id="intro">
        <button class="bunny-card" id="bunny" aria-label="Chạm vào bé thỏ"></button>
        <p class="intro-hint">Bé chạm vào đây nhớ</p>
    </section>

    <!-- Màn 2 -->
    <section id="stage">
        <div class="hedgehog-moments" aria-hidden="true">
            <figure class="hedgehog-moment hedgehog-moment--sleep" style="--halo: #dcb8ef; --tilt: -8deg; --delay: .05s; --float: 2.8s">
                <img src="./assets/a/hedgehog-sleep.png" alt="">
            </figure>
            <figure class="hedgehog-moment hedgehog-moment--eat" style="--halo: #ffc4ba; --tilt: 7deg; --delay: .18s; --float: 3.1s">
                <img src="./assets/a/hedgehog-eat.png" alt="">
            </figure>
            <figure class="hedgehog-moment hedgehog-moment--piano" style="--halo: #e9c399; --tilt: -6deg; --delay: .31s; --float: 3.4s">
                <img src="./assets/a/hedgehog-piano.png" alt="">
            </figure>
            <figure class="hedgehog-moment hedgehog-moment--work" style="--halo: #bcd6f2; --tilt: 6deg; --delay: .44s; --float: 3s">
                <img src="./assets/a/hedgehog-work.png" alt="">
            </figure>
            <figure class="hedgehog-moment hedgehog-moment--camera" style="--halo: #ffe48e; --tilt: 5deg; --delay: .57s; --float: 2.9s">
                <img src="./assets/a/hedgehog-camera.png" alt="">
            </figure>
            <figure class="hedgehog-moment hedgehog-moment--happy" style="--halo: #ffd9a8; --tilt: -5deg; --delay: .70s; --float: 2.7s">
                <img src="./assets/a/hedgehog-happy.png" alt="">
            </figure>
        </div>
        <h1 class="name" id="name"></h1>
        <div class="bouquet">
            <img class="wrap-img" src="./assets/a/bhoa-cam-tu-cau-hong.png" alt="">
            <button class="envelope" id="openLetter" aria-label="Mở thư">
                <img src="./assets/err/flower.png" alt="">
            </button>
            <span class="envelope-hint">Mở thư đi nè 💌</span>
        </div>
    </section>

    <!-- Lá thư -->
    <div id="letterWrap">
        <article class="letter">
            <div class="letter-photo-frame">
                <img class="letter-photo" id="letterPhoto" src="./assets/a/nhims.jpg" alt="Kỷ niệm của chúng mình">
            </div>
            <h2 id="letterTitle"></h2>
            <p class="message" id="message"></p>
            <p class="sign" id="sign"></p>
        </article>
    </div>

    <div id="memories"></div>
    <div id="photoView"><img alt="Ảnh kỷ niệm"></div>

    <div class="layer" id="fx" style="z-index: 7"></div>

    <button id="musicBtn" aria-label="Bật/tắt nhạc">🎵</button>
    <audio id="bgm" loop></audio>

    <script src="./assets/js/share.js"></script>
    <script>
        /* =====================================================
         *  NỘI DUNG MẶC ĐỊNH — dùng khi mở trực tiếp flower.html.
         *  Có thể thay đổi nhanh nội dung trong CONFIG bên dưới.
         * ===================================================== */
        const CONFIG = {
            name: "Tặng Nhím",                          // chữ to trên bó hoa
            letterTitle: "Gửi em, nhân ngày 20/10",
            message:
                "Chúc em ngày 20/10 thật nhiều niềm vui,\n" +
                "luôn xinh đẹp, khỏe mạnh và cười thật tươi.\n" +
                "Cảm ơn em vì đã luôn ở bên anh.\n" +
                "Bó hoa này là dành riêng cho em đó 🌷",
            sender: "Tài",
            music: "./n/canon-in-d.mp3",          // nhạc nền mặc định
            letterPhoto: "./assets/a/nhims.jpg",  // ảnh hiện trong lá thư
            photos: [],                          // ảnh kỷ niệm bay lượn
            photoCount: 7,                       // số ảnh bay cùng lúc
        };
        /* ===================================================== */

        const $ = (id) => document.getElementById(id);
        const rand = (a, b) => a + Math.random() * (b - a);
        const bg = $("bg");
        const fx = $("fx");

        const bgm = $("bgm");
        const musicBtn = $("musicBtn");

        function applyConfig() {
            $("name").textContent = CONFIG.name;
            document.title = CONFIG.name || document.title;
            $("letterTitle").textContent = CONFIG.letterTitle;
            $("sign").textContent = CONFIG.sender;
            $("letterPhoto").src = CONFIG.letterPhoto || "./assets/a/nhims.jpg";
            if (CONFIG.music) bgm.src = CONFIG.music;
            else bgm.removeAttribute("src");
        }

        // Link có dữ liệu tuỳ chỉnh mang nội dung trong phần #d=...
        async function loadGiftFromLink() {
            const code = GiftShare.giftCodeFromLocation();
            if (!code) return;
            try {
                const data = await GiftShare.decodeGift(code);
                for (const key of Object.keys(CONFIG)) {
                    if (data[key] !== undefined) CONFIG[key] = data[key];
                }
            } catch (err) {
                console.warn("Không đọc được link quà, dùng nội dung mặc định.", err);
            }
        }

        applyConfig();
        loadGiftFromLink().then(applyConfig);

        /* ---------- Nhạc ---------- */
        function playMusic() {
            if (!bgm.getAttribute("src")) return;
            bgm.play().then(() => musicBtn.classList.add("spin")).catch(() => {});
        }
        musicBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (bgm.paused) playMusic();
            else { bgm.pause(); musicBtn.classList.remove("spin"); }
        });

        /* ---------- Hiệu ứng nền ---------- */
        function spawnPetal() {
            const p = document.createElement("div");
            p.className = "petal";
            const size = rand(9, 18);
            p.style.left = rand(0, 100) + "vw";
            p.style.width = size + "px";
            p.style.height = size * 1.3 + "px";
            p.style.setProperty("--drift", rand(-120, 120) + "px");
            p.style.setProperty("--spin", rand(-540, 540) + "deg");
            p.style.animationDuration = rand(6, 12) + "s";
            bg.appendChild(p);
            p.addEventListener("animationend", () => p.remove());
        }

        function spawnSparkle() {
            const s = document.createElement("div");
            s.className = "sparkle";
            s.style.left = rand(15, 85) + "vw";
            s.style.top = rand(8, 85) + "vh";
            bg.appendChild(s);
            s.addEventListener("animationend", () => s.remove());
        }

        const HEARTS = ["💖", "💗", "💕", "🌸", "✨"];
        function burstHearts(x, y, count = 10) {
            for (let i = 0; i < count; i++) {
                const h = document.createElement("div");
                h.className = "heart";
                h.textContent = HEARTS[i % HEARTS.length];
                const angle = rand(0, Math.PI * 2);
                const dist = rand(50, 130);
                h.style.left = x + "px";
                h.style.top = y + "px";
                h.style.setProperty("--dx", Math.cos(angle) * dist + "px");
                h.style.setProperty("--dy", Math.sin(angle) * dist + "px");
                h.style.setProperty("--s", rand(14, 26) + "px");
                fx.appendChild(h);
                h.addEventListener("animationend", () => h.remove());
            }
        }

        // Các bé con chạy qua lại (vẽ bằng SVG, nhìn sang phải)
        const CRITTERS = [
            // Thỏ hồng tròn
            `<svg viewBox="0 0 60 60">
                <ellipse cx="22" cy="12" rx="5" ry="13" fill="#fff" stroke="#e9879f" stroke-width="2" transform="rotate(-12 22 12)"/>
                <ellipse cx="34" cy="11" rx="5" ry="13" fill="#fff" stroke="#e9879f" stroke-width="2" transform="rotate(14 34 11)"/>
                <ellipse cx="34" cy="11" rx="2" ry="8" fill="#ffc2d1" transform="rotate(14 34 11)"/>
                <ellipse cx="30" cy="38" rx="22" ry="19" fill="#fff" stroke="#e9879f" stroke-width="2"/>
                <circle cx="9" cy="42" r="5" fill="#fff" stroke="#e9879f" stroke-width="2"/>
                <circle cx="35" cy="34" r="2.4" fill="#5c2f3b"/><circle cx="46" cy="34" r="2.4" fill="#5c2f3b"/>
                <ellipse cx="32" cy="41" rx="3.5" ry="2.2" fill="#ffadc0"/><ellipse cx="50" cy="41" rx="3.5" ry="2.2" fill="#ffadc0"/>
                <path d="M39 39 q2 2.5 4 0" fill="none" stroke="#5c2f3b" stroke-width="1.6" stroke-linecap="round"/>
            </svg>`,
            // Gà con vàng
            `<svg viewBox="0 0 60 60">
                <path d="M28 10 q4 -8 8 0 q-4 -3 -8 0z" fill="#f6b73c"/>
                <circle cx="30" cy="34" r="21" fill="#ffe27a" stroke="#e8b33a" stroke-width="2"/>
                <path d="M14 36 q-8 -2 -6 8 q6 0 10 -4z" fill="#ffd34f" stroke="#e8b33a" stroke-width="1.5"/>
                <circle cx="38" cy="29" r="2.5" fill="#5c2f3b"/>
                <path d="M47 33 l8 3 l-8 3z" fill="#f59a3c"/>
                <ellipse cx="40" cy="38" rx="3.5" ry="2" fill="#ffb3a7"/>
                <path d="M25 55 v4 M34 55 v4" stroke="#f59a3c" stroke-width="2.5" stroke-linecap="round"/>
            </svg>`,
        ];

        function spawnRunner() {
            const ltr = Math.random() < .5;
            const size = rand(38, 58);
            const r = document.createElement("div");
            r.className = "runner" + (ltr ? "" : " rtl");
            r.style.setProperty("--size", size + "px");
            r.style.setProperty("--from", ltr ? `-${size + 10}px` : `calc(100vw + 10px)`);
            r.style.setProperty("--to", ltr ? `calc(100vw + 10px)` : `-${size + 10}px`);
            r.style.setProperty("--t", rand(7, 11) + "s");
            r.style.bottom = rand(6, 60) + "px";
            r.innerHTML = `<div class="hop">${CRITTERS[Math.floor(rand(0, CRITTERS.length))]}</div>`;
            bg.appendChild(r);
            r.addEventListener("animationend", (e) => { if (e.animationName === "run") r.remove(); });
        }

        // Bướm bay ngang màn hình
        const BUTTERFLY_COLORS = [["#ffb3c7", "#f06c8e"], ["#d9c2ff", "#9b7be0"], ["#ffd59e", "#f2a33c"]];
        function spawnButterfly() {
            const [c1, c2] = BUTTERFLY_COLORS[Math.floor(rand(0, BUTTERFLY_COLORS.length))];
            const ltr = Math.random() < .5;
            const b = document.createElement("div");
            b.className = "butterfly";
            const w = innerWidth, h = innerHeight;
            b.style.setProperty("--x0", (ltr ? -50 : w + 10) + "px");
            b.style.setProperty("--x1", (ltr ? w + 10 : -50) + "px");
            b.style.setProperty("--y0", rand(h * .1, h * .7) + "px");
            b.style.setProperty("--y1", rand(h * .05, h * .6) + "px");
            b.style.setProperty("--t", rand(9, 14) + "s");
            b.innerHTML = `
                <div class="bob"><svg viewBox="0 0 40 30" style="transform: scaleX(${ltr ? 1 : -1}) rotate(10deg)">
                    <g class="wing l"><path d="M20,15 C10,0 0,2 2,12 C3,18 12,18 20,15Z" fill="${c1}" stroke="${c2}"/>
                        <path d="M20,16 C12,22 6,28 10,28 C15,28 19,22 20,16Z" fill="${c2}"/></g>
                    <g class="wing r"><path d="M20,15 C30,0 40,2 38,12 C37,18 28,18 20,15Z" fill="${c1}" stroke="${c2}"/>
                        <path d="M20,16 C28,22 34,28 30,28 C25,28 21,22 20,16Z" fill="${c2}"/></g>
                    <rect x="19" y="9" width="2" height="14" rx="1" fill="#5c2f3b"/>
                </svg></div>`;
            bg.appendChild(b);
            b.addEventListener("animationend", (e) => { if (e.animationName === "fly") b.remove(); });
        }

        setInterval(spawnPetal, 380);
        setInterval(spawnSparkle, 500);

        // Chạm bất kỳ đâu cũng nở tim
        document.addEventListener("pointerdown", (e) => burstHearts(e.clientX, e.clientY, 6));

        /* ---------- Ảnh kỷ niệm bay qua lại, chạm vào để xem to ---------- */
        function startMemories() {
            const box = $("memories");
            const sources = (CONFIG.photos || []).filter(Boolean);
            if (!sources.length) return;
            // Nhân bản ảnh cho đủ số lượng bay trên màn hình
            const count = Math.max(sources.length, CONFIG.photoCount || 0);
            const list = Array.from({ length: count }, (_, i) => sources[i % sources.length]);
            const items = list.map((src) => {
                const btn = document.createElement("button");
                btn.className = "memory";
                const w = Math.round(rand(58, 76));
                btn.style.setProperty("--w", w + "px");
                btn.innerHTML = `<img src="${src}" alt="Ảnh kỷ niệm">`;
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    burstHearts(e.clientX, e.clientY, 10);
                    $("photoView").querySelector("img").src = src;
                    $("photoView").classList.add("open");
                });
                box.appendChild(btn);
                setTimeout(() => btn.classList.add("show"), 400);
                const speed = rand(45, 70);              // px mỗi giây
                const angle = rand(0, Math.PI * 2);
                return {
                    el: btn, w,
                    x: rand(0, innerWidth - w), y: rand(0, innerHeight - w),
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    phase: rand(0, Math.PI * 2),
                };
            });
            let last = performance.now();
            function tick(now) {
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                for (const p of items) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    // Chạm mép thì dội lại
                    if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
                    if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); }
                    if (p.x > innerWidth - p.w) { p.x = innerWidth - p.w; p.vx = -Math.abs(p.vx); }
                    if (p.y > innerHeight - p.w) { p.y = innerHeight - p.w; p.vy = -Math.abs(p.vy); }
                    const tilt = Math.sin(now / 900 + p.phase) * 10;
                    const float = Math.sin(now / 600 + p.phase) * 6;
                    p.el.style.transform = `translate(${p.x}px, ${p.y + float}px) rotate(${tilt}deg)`;
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        $("photoView").addEventListener("click", () => $("photoView").classList.remove("open"));

        /* ---------- Luồng chính ---------- */
        $("bunny").addEventListener("click", (e) => {
            playMusic();
            if (CONFIG.music) musicBtn.style.display = "block";
            burstHearts(e.clientX, e.clientY, 18);
            $("intro").classList.add("leave");
            setTimeout(() => {
                $("intro").remove();
                $("stage").classList.add("show");
                startMemories();
                spawnRunner();
                spawnButterfly();
                setInterval(spawnRunner, 5000);
                setInterval(spawnButterfly, 4000);
            }, 600);
        }, { once: true });

        let typingTimer;
        function typeMessage(text) {
            const msg = $("message");
            const sign = $("sign");
            msg.textContent = "";
            msg.classList.remove("done");
            sign.classList.remove("show");
            clearInterval(typingTimer);
            const chars = Array.from(text);
            let i = 0;
            typingTimer = setInterval(() => {
                msg.textContent += chars[i++];
                if (i >= chars.length) {
                    clearInterval(typingTimer);
                    msg.classList.add("done");
                    sign.classList.add("show");
                }
            }, 60);
        }

        $("openLetter").addEventListener("click", (e) => {
            e.stopPropagation();
            burstHearts(e.clientX, e.clientY, 14);
            $("letterWrap").classList.add("open");
            typeMessage(CONFIG.message);
        });

        // Chạm ra ngoài lá thư để đóng
        $("letterWrap").addEventListener("click", (e) => {
            if (e.target === $("letterWrap")) $("letterWrap").classList.remove("open");
        });
    </script>
</body>

</html>
